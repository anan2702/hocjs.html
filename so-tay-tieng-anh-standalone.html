<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Tay Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F3EC;
    --paper-alt: #EFEAE0;
    --ink: #1F3350;
    --ink-soft: #4A5A72;
    --amber: #B87F2E;
    --amber-dim: #D9B074;
    --sage: #5E7F63;
    --text: #22252B;
    --text-dim: #6B6F76;
    --rule: #D8D2C4;
    --danger: #A64B3E;
    --card-bg: #FFFDF9;
  }
  :root:not([data-theme="light"]) {
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181F;
      --paper-alt: #1B212B;
      --ink: #E9EDF3;
      --ink-soft: #AEB9CA;
      --amber: #E0A85A;
      --amber-dim: #8A6A3B;
      --sage: #8FB596;
      --text: #E9EDF3;
      --text-dim: #9AA2AF;
      --rule: #2C3340;
      --danger: #E0776A;
      --card-bg: #1B212B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181F;
    --paper-alt: #1B212B;
    --ink: #E9EDF3;
    --ink-soft: #AEB9CA;
    --amber: #E0A85A;
    --amber-dim: #8A6A3B;
    --sage: #8FB596;
    --text: #E9EDF3;
    --text-dim: #9AA2AF;
    --rule: #2C3340;
    --danger: #E0776A;
    --card-bg: #1B212B;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.masthead h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header.masthead .tagline {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  header.masthead .count {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .header-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .io-buttons {
    display: flex;
    gap: 8px;
  }
  .io-btn {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    background: var(--card-bg);
    color: var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
  }
  .io-btn:hover { border-color: var(--amber); color: var(--amber); }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }
  @media (min-width: 760px) {
    .layout { grid-template-columns: 320px 1fr; align-items: start; }
  }

  /* ---- Form panel ---- */
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    padding: 20px;
  }
  .panel h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    margin: 0 0 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .field-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  input[type="text"], textarea, select {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--text);
    border-radius: 3px;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: 2px solid var(--amber);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 52px; }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border: none;
    font-size: 14px;
  }
  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    padding: 10px 14px;
    border-radius: 3px;
    font-weight: 600;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--amber); color: var(--text); }
  .btn-primary:active { transform: translateY(1px); }

  .speak-btn {
    flex-shrink: 0;
    width: 38px;
    background: var(--paper-alt);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speak-btn:hover { background: var(--amber-dim); }

  /* ---- List side ---- */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .toolbar input[type="text"] { flex: 1; }
  .toolbar select { width: auto; flex-shrink: 0; }

  .empty {
    border: 1px dashed var(--rule);
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty strong { display: block; color: var(--ink); font-family: 'Source Serif 4', serif; font-size: 17px; margin-bottom: 6px; font-weight: 600; }

  .entry {
    border-bottom: 1px solid var(--rule);
    padding: 16px 4px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: start;
  }
  .entry:first-child { padding-top: 0; }

  .entry-main { min-width: 0; }
  .entry-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .entry-word {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
  }
  .entry-tag {
    font-size: 11px;
    color: var(--sage);
    border: 1px solid var(--sage);
    padding: 1px 7px;
    border-radius: 10px;
  }
  .entry-meaning {
    font-size: 14px;
    color: var(--text);
    margin-top: 4px;
  }
  .entry-example {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 6px;
    line-height: 1.5;
  }
  .entry-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .icon-btn:hover { border-color: var(--amber); color: var(--amber); }
  .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
  }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 36px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Sổ Tay Tiếng Anh</h1>
      <div class="tagline">Ghi từ vựng, cụm từ và nghe cách phát âm</div>
    </div>
    <div class="header-actions">
      <div class="count" id="countLabel">0 mục</div>
      <div class="io-buttons">
        <button class="io-btn" id="exportBtn" title="Tải về file sao lưu">Tải về</button>
        <label class="io-btn" for="importFile">Nhập file</label>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Thêm mục mới</h2>
      <div class="field">
        <label for="fWord">Từ / cụm từ tiếng Anh</label>
        <div class="field-row">
          <input type="text" id="fWord" placeholder="ví dụ: procrastinate">
          <button class="speak-btn" id="previewSpeak" title="Nghe thử" aria-label="Nghe thử">♪</button>
        </div>
      </div>
      <div class="field">
        <label for="fMeaning">Nghĩa tiếng Việt</label>
        <input type="text" id="fMeaning" placeholder="ví dụ: trì hoãn">
      </div>
      <div class="field">
        <label for="fExample">Câu ví dụ (không bắt buộc)</label>
        <textarea id="fExample" placeholder="ví dụ: Stop procrastinating and start studying."></textarea>
      </div>
      <div class="field">
        <label for="fTag">Chủ đề (không bắt buộc)</label>
        <input type="text" id="fTag" placeholder="ví dụ: công việc, du lịch...">
      </div>
      <button class="btn-primary" id="addBtn">Lưu vào sổ tay</button>
      <div class="hint">Nhấn ♪ để nghe phát âm trước khi lưu.</div>
    </div>

    <div>
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Tìm từ hoặc nghĩa...">
        <select id="tagFilter">
          <option value="">Tất cả chủ đề</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <footer class="note">Dữ liệu được lưu trên trình duyệt này (localStorage). Giọng đọc dùng công nghệ text-to-speech có sẵn của trình duyệt.</footer>
</div>

<script>
(function() {
  const STORAGE_KEY = 'english-notebook-entries-v1';
  let entries = [];
  let editingId = null;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) { entries = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch (e) { console.error('Storage error', e); }
  }

  async function persistUpsert() { saveLocal(); }
  async function persistDelete() { saveLocal(); }

  function speak(text) {
    if (!text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
      if (enVoice) u.voice = enVoice;
      window.speechSynthesis.speak(u);
    } catch (e) {
      alert('Trình duyệt này không hỗ trợ đọc giọng nói.');
    }
  }
  // Some browsers load voices asynchronously
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  const fWord = document.getElementById('fWord');
  const fMeaning = document.getElementById('fMeaning');
  const fExample = document.getElementById('fExample');
  const fTag = document.getElementById('fTag');
  const addBtn = document.getElementById('addBtn');
  const previewSpeak = document.getElementById('previewSpeak');
  const list = document.getElementById('list');
  const countLabel = document.getElementById('countLabel');
  const searchBox = document.getElementById('searchBox');
  const tagFilter = document.getElementById('tagFilter');
  const exportBtn = document.getElementById('exportBtn');
  const importFile = document.getElementById('importFile');

  loadLocal();
  render();

  exportBtn.addEventListener('click', () => {
    if (entries.length === 0) { alert('Sổ tay đang trống, chưa có gì để tải về.'); return; }
    const data = JSON.stringify(entries, null, 2);
    const filename = 'so-tay-tieng-anh-' + new Date().toISOString().slice(0, 10) + '.json';
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importFile.addEventListener('change', (evt) => {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('bad format');
        const existingIds = new Set(entries.map(e => e.id));
        let added = 0;
        imported.forEach(item => {
          if (item && item.word && !existingIds.has(item.id)) {
            entries.push({
              id: item.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
              word: item.word, meaning: item.meaning || '', example: item.example || '',
              tag: item.tag || '', created: item.created || Date.now()
            });
            added++;
          }
        });
        entries.sort((a, b) => b.created - a.created);
        saveLocal();
        render();
        alert('Đã nhập ' + added + ' mục mới.');
      } catch (e) {
        alert('File không đúng định dạng. Vui lòng chọn file đã tải về từ chính sổ tay này.');
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  previewSpeak.addEventListener('click', () => speak(fWord.value.trim()));

  addBtn.addEventListener('click', async () => {
    const word = fWord.value.trim();
    const meaning = fMeaning.value.trim();
    const example = fExample.value.trim();
    const tag = fTag.value.trim();
    if (!word) { fWord.focus(); return; }

    let entry;
    if (editingId) {
      entry = entries.find(x => x.id === editingId);
      if (entry) { entry.word = word; entry.meaning = meaning; entry.example = example; entry.tag = tag; }
      editingId = null;
      addBtn.textContent = 'Lưu vào sổ tay';
    } else {
      entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        word, meaning, example, tag,
        created: Date.now()
      };
      entries.unshift(entry);
    }
    await persistUpsert(entry);
    fWord.value = ''; fMeaning.value = ''; fExample.value = ''; fTag.value = '';
    fWord.focus();
    render();
  });

  fWord.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
  });

  function startEdit(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    fWord.value = e.word; fMeaning.value = e.meaning;
    fExample.value = e.example || ''; fTag.value = e.tag || '';
    editingId = id;
    addBtn.textContent = 'Cập nhật mục';
    fWord.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteEntry(id) {
    entries = entries.filter(x => x.id !== id);
    await persistDelete(id);
    render();
  }

  function refreshTagOptions() {
    const tags = Array.from(new Set(entries.map(e => e.tag).filter(Boolean))).sort();
    const current = tagFilter.value;
    tagFilter.innerHTML = '<option value="">Tất cả chủ đề</option>' +
      tags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    if (tags.includes(current)) tagFilter.value = current;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function render() {
    const q = searchBox.value.trim().toLowerCase();
    const tagQ = tagFilter.value;
    const filtered = entries.filter(e => {
      const matchesQ = !q || e.word.toLowerCase().includes(q) || (e.meaning || '').toLowerCase().includes(q);
      const matchesTag = !tagQ || e.tag === tagQ;
      return matchesQ && matchesTag;
    });

    countLabel.textContent = entries.length + ' mục';
    refreshTagOptions();

    if (entries.length === 0) {
      list.innerHTML = `<div class="empty"><strong>Sổ tay còn trống</strong>Thêm từ đầu tiên của bạn ở bên trái.</div>`;
      return;
    }
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><strong>Không tìm thấy</strong>Thử từ khóa khác.</div>`;
      return;
    }

    list.innerHTML = filtered.map(e => `
      <div class="entry" data-id="${e.id}">
        <div class="entry-main">
          <div class="entry-head">
            <span class="entry-word">${escapeHtml(e.word)}</span>
            ${e.tag ? `<span class="entry-tag">${escapeHtml(e.tag)}</span>` : ''}
          </div>
          ${e.meaning ? `<div class="entry-meaning">${escapeHtml(e.meaning)}</div>` : ''}
          ${e.example ? `<div class="entry-example">"${escapeHtml(e.example)}"</div>` : ''}
        </div>
        <div class="entry-actions">
          <button class="icon-btn speak" title="Nghe" aria-label="Nghe">♪</button>
          <button class="icon-btn edit" title="Sửa" aria-label="Sửa">✎</button>
          <button class="icon-btn del" title="Xóa" aria-label="Xóa">✕</button>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.entry').forEach(el => {
      const id = el.getAttribute('data-id');
      const e = entries.find(x => x.id === id);
      el.querySelector('.speak').addEventListener('click', () => speak(e.word));
      el.querySelector('.edit').addEventListener('click', () => startEdit(id));
      el.querySelector('.del').addEventListener('click', () => {
        if (confirm('Xóa mục "' + e.word + '"?')) deleteEntry(id);
      });
    });
  }

  searchBox.addEventListener('input', render);
  tagFilter.addEventListener('change', render);
})();
</script>
</body>
</html>
